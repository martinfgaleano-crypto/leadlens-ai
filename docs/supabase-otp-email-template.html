<!--
  LeadLens — Supabase auth email template (numeric OTP).
  Paste into: Supabase → Authentication → Email Templates → (the template invoked by signInWithOtp:
  "Magic Link" / "Confirm signup"; confirm the exact one in the dashboard). Requires custom SMTP.
  The 6-digit code is rendered from {{ .Token }} in the BODY (never the subject). No secrets, no
  tracking pixels, no external/marketing links, no unsafe HTML.

  Subject line (set in the "Subject" field, not here):
    Your LeadLens verification code
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;">
        <tr>
          <td style="padding:32px 32px 8px;">
            <div style="font-size:18px;font-weight:800;letter-spacing:-.02em;color:#0f172a;">LeadLens</div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0;">
            <div style="font-size:13px;font-weight:700;letter-spacing:.02em;color:#0284c7;text-transform:uppercase;">Your verification code</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 8px;">
            <div style="font-size:38px;font-weight:800;letter-spacing:.28em;color:#0f172a;padding:16px 0;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;text-align:center;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 4px;">
            <p style="margin:0;font-size:14px;line-height:1.6;color:#475569;">Enter this code in LeadLens to continue. It expires shortly.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 32px;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">If you didn't request this email, you can safely ignore it.</p>
          </td>
        </tr>
      </table>
      <div style="max-width:440px;padding:16px 8px 0;font-size:11px;color:#cbd5e1;text-align:center;">LeadLens — Account Opportunity Intelligence</div>
    </td>
  </tr>
</table>
